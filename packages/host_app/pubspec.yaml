name: tsukiro_chat
description: "Tsukiro Chat 宿主 App"
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # ── 本项目内核（纯 Dart 包） ──
  plugin_core:
    path: ../plugin_core
  model_gateway:
    path: ../model_gateway

  # ── 状态管理 ──
  # Riverpod 而非 Provider/Bloc：编译期安全、不依赖 BuildContext、好测
  flutter_riverpod: ^2.6.1

  # ── 本地存储 ──
  # Demo 阶段用 sqflite 而不是 Drift：Drift 要 build_runner 代码生成，
  # 每次改表结构都得跑一次。Demo 的表结构已经定稿（见 docs/10-data-model.md），
  # 手工写 SQL 反而更直观。正式版再评估。
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # ── 插件运行时 ──
  # 插件代码跑在系统 WebView 里，通过 Bridge 与宿主通信。
  # 用系统 WebView 而不是内嵌 V8/QuickJS：省 3-5 MB 体积，
  # 且系统 WebView 会跟着系统更新（安全补丁）。
  webview_flutter: ^4.10.0
  # 受信任宿主内的 Flame Surface；普通插件不能上传 Dart/Flame 代码。
  flame: ^1.38.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true
  assets:
    # 整目录：真实配置 dev-config.json 不进版本控制（见 dev/README.md），
    # 但构建时若存在会被打进 App —— 发版前务必确认没把它打进去。
    - assets/
    # 插件运行时（JS 侧），创建插件 WebView 时注入
    - assets/plugin_runtime/
    # >>> demo_plugins (由 scripts/sync_demo_plugins.mjs 生成，勿手改)
    - assets/demo_plugins/time-plugin/assets/
    - assets/demo_plugins/time-plugin/handlers/
    - assets/demo_plugins/time-plugin/
    - assets/demo_plugins/translate-button/assets/
    - assets/demo_plugins/translate-button/pages/
    - assets/demo_plugins/translate-button/
    - assets/demo_plugins/sakura-theme/assets/
    - assets/demo_plugins/sakura-theme/
    - assets/demo_plugins/status-panel/handlers/
    - assets/demo_plugins/status-panel/
    - assets/demo_plugins/mini-game/assets/
    - assets/demo_plugins/mini-game/pages/
    - assets/demo_plugins/mini-game/
    - assets/demo_plugins/rock-paper-scissors/pages/
    - assets/demo_plugins/rock-paper-scissors/
    # <<< demo_plugins
