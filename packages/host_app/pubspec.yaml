name: tsukiro_chat
description: "Tsukiro Chat 宿主 App"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # ── 本项目内核（纯 Dart 包） ──
  plugin_core:
    path: ../plugin_core
  model_gateway:
    path: ../model_gateway

  # ── 状态管理 ──
  # Riverpod 而非 Provider/Bloc：编译期安全、不依赖 BuildContext、好测
  flutter_riverpod: ^2.6.1

  # ── 本地存储 ──
  # Demo 阶段用 sqflite 而不是 Drift：Drift 要 build_runner 代码生成，
  # 每次改表结构都得跑一次。Demo 的表结构已经定稿（见 docs/10-data-model.md），
  # 手工写 SQL 反而更直观。正式版再评估。
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true
  assets:
    # 整目录：真实配置 dev-config.json 不进版本控制（见 dev/README.md），
    # 但构建时若存在会被打进 App —— 发版前务必确认没把它打进去。
    - assets/
