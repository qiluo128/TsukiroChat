include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: error
    unused_local_variable: warning

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - avoid_print
    - directives_ordering
    # 刻意不启用 require_trailing_commas：它是纯格式偏好，会产生大量 info 噪音，
    # 而真正重要的是下面的 strict-* 与 unused_* 检查。
